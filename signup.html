<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up | TipsHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pitch: #0b2f22;
      --pitch-card: #14402e;
      --chalk: #f4f1e8;
      --chalk-dim: #c9d4c9;
      --floodlight: #f2a91b;
      --win: #4fb572;
      --loss: #d95c4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--pitch);
      color: var(--chalk);
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .display { font-family: 'Oswald', sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; width: 100%; }

    header.nav {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky; top: 0; background: rgba(11,47,34,0.95);
      backdrop-filter: blur(6px); z-index: 20;
    }
    header.nav .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; text-decoration: none; }
    .logo span { color: var(--floodlight); }
    nav.links { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    nav.links a { text-decoration: none; }
    .link-dim { color: var(--chalk-dim); }
    .btn {
      display: inline-block; border: none; cursor: pointer;
      font-family: 'Oswald', sans-serif; letter-spacing: 0.3px;
      border-radius: 6px; padding: 10px 18px; font-size: 14px;
      text-decoration: none; text-align: center;
    }
    .btn-primary { background: var(--floodlight); color: var(--pitch); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--chalk); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .btn-chalk { background: var(--chalk); color: var(--pitch); }

    footer.site-footer {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 28px 0; text-align: center; font-size: 12px; color: var(--chalk-dim);
    }
  </style>
<style>
  main.auth { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
  .card { width: 100%; max-width: 380px; background: var(--pitch-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 26px; }
  .card h1 { font-size: 24px; margin: 0 0 4px; }
  .card p.sub { color: var(--chalk-dim); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 14px; color: var(--chalk-dim); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--pitch); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 10px 12px; color: var(--chalk); font-size: 14px;
    margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--floodlight); }
  .error { color: var(--loss); font-size: 14px; margin: 0 0 14px; }
  .foot-link { text-align: center; font-size: 14px; color: var(--chalk-dim); margin-top: 16px; }
  .foot-link a { color: var(--floodlight); text-decoration: none; }
  button[type=submit] { width: 100%; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="index.html" class="logo">TIPS<span>HQ</span></a>
    <nav class="links">
      <a href="vip.html" style="color:var(--floodlight); font-weight:500;">Go VIP</a>
      <a href="login.html" class="link-dim">Log in</a>
    </nav>
  </div>
</header>

<main class="auth">
  <form class="card" id="signup-form">
    <h1 class="display">Create account</h1>
    <p class="sub">Free tips daily. Upgrade to VIP any time.</p>

    <label for="name">Name</label>
    <input type="text" id="name" required>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="07XXXXXXXX" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <p class="error" id="error" style="display:none;"></p>

    <button type="submit" class="btn btn-primary">Sign Up</button>

    <p class="foot-link">Have an account? <a href="login.html">Log in</a></p>
  </form>
</main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
      collection, getDocs, query, orderBy, where, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---- Paste your Firebase config here ----
    // Firebase console → Project settings → General → Your apps → SDK setup and config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = {
      doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
      collection, getDocs, query, orderBy, where, serverTimestamp, Timestamp,
      createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut
    };

    // Turns "0771234567" or "+256771234567" into "256771234567"
    window.normalizePhone = function (raw) {
      let p = raw.replace(/[^0-9]/g, '');
      if (p.startsWith('0')) p = '256' + p.slice(1);
      if (p.startsWith('256256')) p = p.slice(3);
      return p;
    };
    window.phoneToEmail = function (raw) {
      return window.normalizePhone(raw) + '@tipshq.local';
    };
    window.fmtUGX = function (n) {
      return 'UGX ' + Number(n).toLocaleString('en-UG');
    };
    window.fmtKickoff = function (iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString('en-UG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    };

    // Resolves once with the current user (or null) so pages don't have
    // to guess when auth state is ready.
    window.authReady = new Promise((resolve) => {
      window.fb.onAuthStateChanged(window.auth, (user) => resolve(user));
    });
  </script>
<script type="module">
  document.getElementById('signup-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const err = document.getElementById('error');
    err.style.display = 'none';

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const normalized = normalizePhone(phone);

    try {
      const cred = await fb.createUserWithEmailAndPassword(auth, phoneToEmail(phone), password);
      await fb.setDoc(fb.doc(db, 'profiles', cred.user.uid), {
        phone: normalized,
        name: name,
        isAdmin: false,
        vipExpiresAt: null,
        createdAt: fb.serverTimestamp()
      });
      location.href = 'index.html';
    } catch (e2) {
      err.textContent = e2.code === 'auth/email-already-in-use'
        ? 'That phone number is already registered — try logging in instead.'
        : 'Could not sign up. Please try again.';
      err.style.display = 'block';
    }
  });
</script>
</body>
</html>
