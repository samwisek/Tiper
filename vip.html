<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go VIP | TipsHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pitch: #0b2f22;
      --pitch-card: #14402e;
      --chalk: #f4f1e8;
      --chalk-dim: #c9d4c9;
      --floodlight: #f2a91b;
      --win: #4fb572;
      --loss: #d95c4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--pitch);
      color: var(--chalk);
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .display { font-family: 'Oswald', sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; width: 100%; }

    header.nav {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky; top: 0; background: rgba(11,47,34,0.95);
      backdrop-filter: blur(6px); z-index: 20;
    }
    header.nav .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; text-decoration: none; }
    .logo span { color: var(--floodlight); }
    nav.links { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    nav.links a { text-decoration: none; }
    .link-dim { color: var(--chalk-dim); }
    .btn {
      display: inline-block; border: none; cursor: pointer;
      font-family: 'Oswald', sans-serif; letter-spacing: 0.3px;
      border-radius: 6px; padding: 10px 18px; font-size: 14px;
      text-decoration: none; text-align: center;
    }
    .btn-primary { background: var(--floodlight); color: var(--pitch); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--chalk); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .btn-chalk { background: var(--chalk); color: var(--pitch); }

    footer.site-footer {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 28px 0; text-align: center; font-size: 12px; color: var(--chalk-dim);
    }
  </style>
<style>
  main.vip { flex: 1; max-width: 700px; margin: 0 auto; padding: 50px 20px; width: 100%; }
  .eyebrow { color: var(--floodlight); text-transform: uppercase; letter-spacing: 2px; font-size: 12px; margin-bottom: 8px; }
  main.vip h1 { font-size: 32px; margin: 0 0 10px; }
  main.vip > p { color: var(--chalk-dim); margin: 0 0 28px; }

  .packages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  @media (max-width: 640px) { .packages { grid-template-columns: 1fr; } }
  .pkg {
    text-align: left; border-radius: 10px; padding: 18px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1); background: var(--pitch-card);
  }
  .pkg.selected { border-color: var(--floodlight); background: rgba(242,169,27,0.1); }
  .pkg .name { color: var(--chalk-dim); font-size: 14px; }
  .pkg .price { font-family: 'Oswald', sans-serif; font-size: 22px; margin-top: 4px; }
  .pkg .dur { color: var(--chalk-dim); font-size: 12px; margin-top: 4px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; padding: 20px; z-index: 30;
  }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--pitch-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 24px; max-width: 380px; width: 100%; }
  .modal h2 { font-size: 20px; margin: 0 0 8px; }
  .modal p { color: var(--chalk-dim); font-size: 14px; margin: 0 0 18px; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="index.html" class="logo">TIPS<span>HQ</span></a>
    <nav class="links">
      <a href="login.html" class="link-dim">Log in</a>
      <a href="signup.html" class="btn btn-chalk" style="padding:8px 14px;">Sign up</a>
    </nav>
  </div>
</header>

<main class="vip">
  <div class="eyebrow">VIP Access</div>
  <h1 class="display">Pick your package</h1>
  <p>Pay with MTN Mobile Money or Airtel Money. VIP unlocks instantly after payment is confirmed.</p>

  <div class="packages" id="packages"></div>

  <button class="btn btn-primary" id="pay-btn" style="padding:12px 24px;">Pay VIP</button>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 class="display" id="modal-title">Confirm payment</h2>
    <p id="modal-instructions">
      Send the package amount via MTN or Airtel Mobile Money, then fill in
      the details below so we can confirm it. VIP unlocks once approved.
    </p>
    <form id="pay-form">
      <label style="display:block; font-size:14px; color:var(--chalk-dim); margin-bottom:6px;">Network</label>
      <select id="pay-provider" style="width:100%; background:var(--pitch); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:10px 12px; color:var(--chalk); font-size:14px; margin-bottom:14px;">
        <option value="MTN">MTN Mobile Money</option>
        <option value="Airtel">Airtel Money</option>
      </select>
      <label style="display:block; font-size:14px; color:var(--chalk-dim); margin-bottom:6px;">Number you paid from</label>
      <input type="tel" id="pay-number" placeholder="07XXXXXXXX" required style="width:100%; background:var(--pitch); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:10px 12px; color:var(--chalk); font-size:14px; margin-bottom:14px;">
      <label style="display:block; font-size:14px; color:var(--chalk-dim); margin-bottom:6px;">Transaction ID / reference</label>
      <input type="text" id="pay-reference" placeholder="e.g. MP240829.1234" style="width:100%; background:var(--pitch); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:10px 12px; color:var(--chalk); font-size:14px; margin-bottom:16px;">
      <p class="error" id="pay-error" style="display:none; color:var(--loss); font-size:14px; margin:0 0 12px;"></p>
      <p class="error" id="pay-success" style="display:none; color:var(--win); font-size:14px; margin:0 0 12px;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:8px;">Submit for approval</button>
      <button type="button" class="btn btn-outline" style="width:100%;" id="modal-close">Cancel</button>
    </form>
  </div>
</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
      collection, getDocs, query, orderBy, where, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---- Paste your Firebase config here ----
    // Firebase console → Project settings → General → Your apps → SDK setup and config
    const firebaseConfig = {
      apiKey: "AIzaSyADU7oEvs4vzNVgQn66y8F4HtxEhndtsrk",
      authDomain: "mrprince-2f6f8.firebaseapp.com",
      projectId: "mrprince-2f6f8",
      storageBucket: "mrprince-2f6f8.firebasestorage.app",
      messagingSenderId: "185989073360",
      appId: "1:185989073360:web:2eadbceb524203d03b11d5"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = {
      doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
      collection, getDocs, query, orderBy, where, serverTimestamp, Timestamp,
      createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut
    };

    // Turns "0771234567" or "+256771234567" into "256771234567"
    window.normalizePhone = function (raw) {
      let p = raw.replace(/[^0-9]/g, '');
      if (p.startsWith('0')) p = '256' + p.slice(1);
      if (p.startsWith('256256')) p = p.slice(3);
      return p;
    };
    window.phoneToEmail = function (raw) {
      return window.normalizePhone(raw) + '@tipshq.local';
    };
    window.fmtUGX = function (n) {
      return 'UGX ' + Number(n).toLocaleString('en-UG');
    };
    window.fmtKickoff = function (iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString('en-UG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    };

    // Resolves once with the current user (or null) so pages don't have
    // to guess when auth state is ready.
    window.authReady = new Promise((resolve) => {
      window.fb.onAuthStateChanged(window.auth, (user) => resolve(user));
    });
  </script>
<script type="module">
  let packages = [];
  let selectedId = null;

  function render() {
    document.getElementById('packages').innerHTML = packages.map(p =>
      '<div class="pkg' + (p.id === selectedId ? ' selected' : '') + '" data-id="' + p.id + '">' +
        '<div class="name">' + p.name + '</div>' +
        '<div class="price display">' + fmtUGX(p.priceUgx) + '</div>' +
        '<div class="dur">' + p.durationDays + ' day' + (p.durationDays > 1 ? 's' : '') + ' access</div>' +
      '</div>'
    ).join('');

    document.querySelectorAll('.pkg').forEach(el => {
      el.addEventListener('click', () => {
        selectedId = el.dataset.id;
        render();
      });
    });
  }

  async function loadPackages() {
    const snap = await fb.getDocs(fb.query(fb.collection(db, 'packages'), fb.orderBy('priceUgx')));
    packages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    selectedId = packages[1] ? packages[1].id : (packages[0] && packages[0].id);
    render();
  }
  loadPackages();

  document.getElementById('pay-btn').addEventListener('click', async () => {
    const user = await authReady;
    if (!user) {
      location.href = 'login.html?next=vip.html';
      return;
    }
    document.getElementById('modal-overlay').classList.add('open');
  });
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });

  document.getElementById('pay-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('pay-error');
    const okEl = document.getElementById('pay-success');
    errEl.style.display = 'none';
    okEl.style.display = 'none';

    const user = await authReady;
    if (!user) {
      location.href = 'login.html?next=vip.html';
      return;
    }
    if (!selectedId) {
      errEl.textContent = 'Pick a package first.';
      errEl.style.display = 'block';
      return;
    }

    try {
      await fb.addDoc(fb.collection(db, 'payments'), {
        userId: user.uid,
        packageId: selectedId,
        provider: document.getElementById('pay-provider').value,
        momoNumber: normalizePhone(document.getElementById('pay-number').value),
        reference: document.getElementById('pay-reference').value,
        status: 'pending',
        createdAt: fb.serverTimestamp()
      });
      okEl.textContent = 'Submitted! Your VIP access activates once the admin approves the payment.';
      okEl.style.display = 'block';
      document.getElementById('pay-form').reset();
    } catch (e2) {
      errEl.textContent = 'Could not submit — please try again.';
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
