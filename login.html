<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | TipsHQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pitch: #0b2f22;
      --pitch-card: #14402e;
      --chalk: #f4f1e8;
      --chalk-dim: #c9d4c9;
      --floodlight: #f2a91b;
      --win: #4fb572;
      --loss: #d95c4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--pitch);
      color: var(--chalk);
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .display { font-family: 'Oswald', sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; width: 100%; }

    header.nav {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky; top: 0; background: rgba(11,47,34,0.95);
      backdrop-filter: blur(6px); z-index: 20;
    }
    header.nav .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; text-decoration: none; }
    .logo span { color: var(--floodlight); }
    nav.links { display: flex; align-items: center; gap: 18px; font-size: 14px; }
    nav.links a { text-decoration: none; }
    .link-dim { color: var(--chalk-dim); }
    .btn {
      display: inline-block; border: none; cursor: pointer;
      font-family: 'Oswald', sans-serif; letter-spacing: 0.3px;
      border-radius: 6px; padding: 10px 18px; font-size: 14px;
      text-decoration: none; text-align: center;
    }
    .btn-primary { background: var(--floodlight); color: var(--pitch); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--chalk); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .btn-chalk { background: var(--chalk); color: var(--pitch); }

    footer.site-footer {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 28px 0; text-align: center; font-size: 12px; color: var(--chalk-dim);
    }
  </style>
<style>
  main.auth { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
  .card { width: 100%; max-width: 380px; background: var(--pitch-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 26px; }
  .card h1 { font-size: 24px; margin: 0 0 4px; }
  .card p.sub { color: var(--chalk-dim); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 14px; color: var(--chalk-dim); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--pitch); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 10px 12px; color: var(--chalk); font-size: 14px;
    margin-bottom: 16px; outline: none;
  }
  input:focus { border-color: var(--floodlight); }
  .error { color: var(--loss); font-size: 14px; margin: 0 0 14px; }
  .foot-link { text-align: center; font-size: 14px; color: var(--chalk-dim); margin-top: 16px; }
  .foot-link a { color: var(--floodlight); text-decoration: none; }
  button[type=submit] { width: 100%; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="index.html" class="logo">TIPS<span>HQ</span></a>
    <nav class="links">
      <a href="vip.html" style="color:var(--floodlight); font-weight:500;">Go VIP</a>
      <a href="signup.html" class="btn btn-chalk" style="padding:8px 14px;">Sign up</a>
    </nav>
  </div>
</header>

<main class="auth">
  <form class="card" id="login-form">
    <h1 class="display">Log in</h1>
    <p class="sub">Use the phone number you signed up with.</p>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="07XXXXXXXX" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <p class="error" id="error" style="display:none;"></p>

    <button type="submit" class="btn btn-primary">Log In</button>

    <p class="foot-link">No account? <a href="signup.html">Sign up</a></p>
  </form>
</main>

  <script>
    // ---- Shared data store (localStorage) ----
    // Every page reads/writes the same keys so admin edits show up on
    // the public site immediately. Swap this for real Supabase calls later.
    const STORE_KEY = 'tipshq_data';

    function seedStore() {
      if (localStorage.getItem(STORE_KEY)) return;
      const seed = {
        tips: [
          { id: 1, league: 'English Premier League', home_team: 'Arsenal', away_team: 'Chelsea', market: 'Over 2.5 Goals', odds: '1.85', confidence: 'High', kickoff_time: '2026-08-30T16:30', is_vip: false },
          { id: 2, league: 'Uganda Premier League', home_team: 'KCCA FC', away_team: 'Vipers SC', market: 'Home Win', odds: '2.10', confidence: 'Medium', kickoff_time: '2026-08-29T13:00', is_vip: false },
          { id: 3, league: 'La Liga', home_team: 'Real Madrid', away_team: 'Sevilla', market: 'Home Win & BTTS', odds: '2.60', confidence: 'High', kickoff_time: '2026-08-30T19:00', is_vip: true },
          { id: 4, league: 'Serie A', home_team: 'Inter Milan', away_team: 'Roma', market: 'Under 3.5 Goals', odds: '1.45', confidence: 'High', kickoff_time: '2026-08-30T18:00', is_vip: true }
        ],
        packages: [
          { id: 1, name: 'Daily VIP', price_ugx: 5000, duration_days: 1 },
          { id: 2, name: 'Weekly VIP', price_ugx: 25000, duration_days: 7 },
          { id: 3, name: 'Monthly VIP', price_ugx: 80000, duration_days: 30 }
        ],
        announcements: [
          { id: 1, title: 'Weekend accumulator dropping Saturday', message: 'VIP members should check the tips page from 9am Saturday for the weekend accumulator.' }
        ],
        ads: [
          { id: 1, title: 'Bet responsibly', link_url: '#', active: true }
        ],
        users: []
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(seed));
    }

    function getStore() {
      seedStore();
      return JSON.parse(localStorage.getItem(STORE_KEY));
    }

    function saveStore(data) {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }

    function fmtUGX(n) {
      return 'UGX ' + Number(n).toLocaleString('en-UG');
    }

    function fmtKickoff(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString('en-UG', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    }
  </script>
<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    // TODO: replace with real Supabase auth call
    const err = document.getElementById('error');
    err.textContent = "Login isn't connected yet — this is a demo screen.";
    err.style.display = 'block';
  });
</script>
</body>
</html>
